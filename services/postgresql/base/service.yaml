apiVersion: v1
kind: Service
metadata:
  name: shared-postgresql
  labels:
    app: shared-postgresql
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  type: ClusterIP
  selector:
    app: shared-postgresql
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
      protocol: TCP
