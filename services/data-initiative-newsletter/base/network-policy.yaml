apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: data-initiative-newsletter
spec:
  podSelector:
    matchLabels:
      app: data-initiative-newsletter
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
              app.kubernetes.io/component: controller
            matchExpressions:
              - key: app.kubernetes.io/instance
                operator: In
                values: [ingress-nginx, ingress-nginx-nlb]
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 10.0.0.158/32
        # Docker DNAT changes the DB destination before egress policy evaluation.
        # Recheck this address if the existing DB container is recreated.
        - ipBlock:
            cidr: 172.20.0.3/32
      ports:
        - protocol: TCP
          port: 5432
