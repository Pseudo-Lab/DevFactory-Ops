---
# Backend API
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage-api
spec:
  revisionHistoryLimit: 5
  replicas: 1
  selector:
    matchLabels:
      app: homepage
      component: backend
  template:
    metadata:
      labels:
        app: homepage
        component: backend
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
      - name: ghcr-creds
      containers:
      - name: api
        securityContext:
          allowPrivilegeEscalation: false
        image: ghcr.io/pseudo-lab/devfactory-homepage-backend # Tag will be managed by Kustomize/CI
        imagePullPolicy: Always
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: devfactory-db-secrets
              key: database-url
        - name: IP_SALT
          valueFrom:
            secretKeyRef:
              name: devfactory-db-secrets
              key: ip-salt
        ports:
        - containerPort: 3000
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 2
          periodSeconds: 5
          timeoutSeconds: 2
---
# Frontend
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage-frontend
spec:
  revisionHistoryLimit: 5
  replicas: 1
  selector:
    matchLabels:
      app: homepage
      component: frontend
  template:
    metadata:
      labels:
        app: homepage
        component: frontend
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
      - name: ghcr-creds
      containers:
      - name: frontend
        securityContext:
          allowPrivilegeEscalation: false
        image: ghcr.io/pseudo-lab/devfactory-homepage-frontend # Tag will be managed by Kustomize/CI
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 2
          periodSeconds: 5
          timeoutSeconds: 2
