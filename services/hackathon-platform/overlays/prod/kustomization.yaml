apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hackathon-platform

resources:
  - ../../base
  - namespace.yaml
  - api-configmap.yaml
  - ingress.yaml
  - sealed-secret.yaml
  - ghcr-pull-secret.yaml
  - upload-storage.yaml

patches:
  - target:
      group: bitnami.com
      version: v1alpha1
      kind: SealedSecret
    path: sealed-secrets-sync-wave-patch.yaml
  - target:
      kind: Deployment
      name: hackathon-platform-api
    path: upload-mount-patch.yaml
  - target:
      kind: Job
      name: hackathon-platform-migrate
    path: migration-upload-mount-patch.yaml

labels:
  - pairs:
      environment: production
      project: hackathon-platform
    includeSelectors: false

images:
  - name: ghcr.io/soohyunme/hackathon-platform-api
    newName: ghcr.io/soohyunme/hackathon-platform-api
    newTag: aee340e09292f25889d12128d81ef60d4d91a694
  - name: ghcr.io/soohyunme/hackathon-platform-web
    newName: ghcr.io/soohyunme/hackathon-platform-web
    newTag: aee340e09292f25889d12128d81ef60d4d91a694
