apiVersion: apps/v1
kind: Deployment
metadata:
  name: hackathon-platform-api
spec:
  template:
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: api
          resources:
            requests:
              memory: 1Gi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: uploads
              mountPath: /data/hackathon-uploads
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: hackathon-platform-uploads
