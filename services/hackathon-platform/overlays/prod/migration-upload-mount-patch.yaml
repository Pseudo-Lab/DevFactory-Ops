apiVersion: batch/v1
kind: Job
metadata:
  name: hackathon-platform-migrate
spec:
  template:
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: migrate
          volumeMounts:
            - name: uploads
              mountPath: /data/hackathon-uploads
            - name: migration-0010
              mountPath: /app/alembic/versions/0010_team_tracks.py
              subPath: 0010_team_tracks.py
              readOnly: true
            - name: migration-0010
              mountPath: /app/db/0010_team_tracks.sql
              subPath: 0010_team_tracks.sql
              readOnly: true
      volumes:
        - name: migration-0010
          configMap:
            name: hackathon-platform-migration-0010
        - name: uploads
          persistentVolumeClaim:
            claimName: hackathon-platform-uploads
