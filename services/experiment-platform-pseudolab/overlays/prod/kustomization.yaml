apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: experiment-platform
resources:
  - ../../base
  - namespace.yaml
  - ingress.yaml
  - ghcr-pull-secret.yaml
  - backend-sealed-secret.yaml
commonLabels:
  environment: production
  project: experiment-platform
images:
  - name: ghcr.io/pseudo-lab/experiment-platform-pseudolab-frontend
    newName: ghcr.io/pseudo-lab/iterglow-frontend
    newTag: 4c1654fb6b841ace77097fa3f88d1c6a8afaafbb
  - name: ghcr.io/pseudo-lab/experiment-platform-pseudolab-backend
    newName: ghcr.io/pseudo-lab/iterglow-backend
    newTag: 4c1654fb6b841ace77097fa3f88d1c6a8afaafbb

# Select the approved Google account by its immutable internal ID.
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: experiment-platform-backend
      spec:
        template:
          spec:
            containers:
              - name: backend
                env:
                  - name: ADMIN_ACCOUNT_ID
                    value: "0e6075e1-af12-4c1f-984e-fa9e93d4291e"
