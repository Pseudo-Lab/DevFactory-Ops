apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx-nlb
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://kubernetes.github.io/ingress-nginx
      chart: ingress-nginx
      targetRevision: 4.10.1
      helm:
        releaseName: ingress-nginx-nlb
        valueFiles:
          - $values/infrastructure/base/ingress-nginx/nlb-values.yaml
    - repoURL: https://github.com/Pseudo-Lab/DevFactory-Ops.git
      targetRevision: main
      ref: values
      path: infrastructure/base/ingress-nginx/nlb
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
