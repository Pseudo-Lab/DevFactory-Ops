# Optimized VictoriaMetrics k8s stack for single-node A1 (ARM64)
fullnameOverride: vm

# Replace the two late (95%/97%) capacity alerts, preserving forecast/inode rules.
defaultRules:
  rules:
    NodeFilesystemAlmostOutOfSpace:
      create: false
    KubeNodePressure:
      spec:
        labels:
          # Alertmanager discards info; only DiskPressure needs escalation here.
          severity: '{{ if eq $labels.condition "DiskPressure" }}warning{{ else }}info{{ end }}'

additionalVictoriaMetricsMap:
  node-capacity:
    groups:
      - name: node-capacity
        rules:
          - alert: NodeFilesystemAlmostOutOfSpace
            expr: |
              (
                100 * node_filesystem_avail_bytes{job="node-exporter",fstype!="",mountpoint!=""}
                / node_filesystem_size_bytes{job="node-exporter",fstype!="",mountpoint!=""} <= 20
              ) and (
                100 * node_filesystem_avail_bytes{job="node-exporter",fstype!="",mountpoint!=""}
                / node_filesystem_size_bytes{job="node-exporter",fstype!="",mountpoint!=""} > 10
              ) and (node_filesystem_readonly{job="node-exporter",fstype!="",mountpoint!=""} == 0)
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: Filesystem has at most 20% space left.
              description: 'Filesystem on {{ $labels.device }}, mounted on {{ $labels.mountpoint }}, at {{ $labels.instance }} has only {{ printf "%.2f" $value }}% available space left.'
              runbook_url: https://runbooks.prometheus-operator.dev/runbooks/node/nodefilesystemalmostoutofspace
          - alert: NodeFilesystemAlmostOutOfSpace
            expr: |
              (
                100 * node_filesystem_avail_bytes{job="node-exporter",fstype!="",mountpoint!=""}
                / node_filesystem_size_bytes{job="node-exporter",fstype!="",mountpoint!=""} <= 10
              ) and (node_filesystem_readonly{job="node-exporter",fstype!="",mountpoint!=""} == 0)
            for: 30m
            labels:
              severity: critical
            annotations:
              summary: Filesystem has at most 10% space left.
              description: 'Filesystem on {{ $labels.device }}, mounted on {{ $labels.mountpoint }}, at {{ $labels.instance }} has only {{ printf "%.2f" $value }}% available space left.'
              runbook_url: https://runbooks.prometheus-operator.dev/runbooks/node/nodefilesystemalmostoutofspace

# k3s exposes volume stats on the API endpoint too, with namespace collisions.
# Keep the canonical job=kubelet /metrics series used by existing PVC alerts.
kubeApiServer:
  vmScrape:
    spec:
      endpoints:
        - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
          port: https
          scheme: https
          tlsConfig:
            caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            serverName: kubernetes
          metricRelabelConfigs:
            - action: drop
              source_labels: [__name__]
              regex: kubelet_volume_stats_.+

# Enable Alertmanager with custom config secret
alertmanager:
  enabled: true
  spec:
    configSecret: alertmanager-config
    resources:
      limits:
        cpu: 200m
        memory: 256Mi

# vmalert uses alertmanager for notifying
vmalert:
  enabled: true
  spec:
    resources:
      limits:
        cpu: 200m
        memory: 256Mi
    # No longer blackhole, it will now talk to alertmanager

# Grafana is included in the stack, but we can also use it separately.
# For now, let's keep it in the stack for easier integration.
grafana:
  enabled: true
  datasourceConfigMaps:
    - grafana-loki-datasource
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    hosts:
      - grafana.pseudolab-devfactory.com
    tls:
      - secretName: grafana-tls
        hosts:
          - grafana.pseudolab-devfactory.com
  admin:
    existingSecret: grafana-admin-creds
    userKey: admin-user
    passwordKey: admin-password

# VictoriaMetrics Single node (cheaper than cluster version)
vmsingle:
  enabled: true
  spec:
    replicaCount: 1
    resources:
      limits:
        # Leave headroom for long-range Grafana queries alongside rule evaluation.
        cpu: "1"
        memory: 2048Mi
      requests:
        cpu: 100m
        memory: 512Mi
    retentionPeriod: "180d"

# Scrape configurations
vmagent:
  enabled: true
  spec:
    resources:
      limits:
        cpu: 200m
        memory: 256Mi
    remoteWrite:
      - url: "http://vmsingle-vm.monitoring.svc:8428/api/v1/write"

# Component configurations
kubeStateMetrics:
  enabled: true

prometheus-node-exporter:
  enabled: true
  resources:
    limits:
      cpu: 250m
      memory: 128Mi

# k3s specific: These components are internal or bind to localhost, causing 'Down' alerts.
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false

kubelet:
  enabled: true
  serviceMonitor:
    https: true # k3s kubelet uses https on 10250

# Cleanup hook configuration to fix non-existent rancher/kubectl:v1.32 image issue
victoria-metrics-operator:
  cleanup:
    image:
      tag: v1.31.1
