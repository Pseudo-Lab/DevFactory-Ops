apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../../../base/monitoring/gatus/base
  - ingress.yaml
  - configmap.yaml

# Suffix handled by namePrefix/Suffix
nameSuffix: -public

patches:
  - target:
      kind: Deployment
      name: gatus
    patch: |-
      - op: replace
        path: /spec/template/spec/volumes/0/configMap/name
        value: gatus-config-public
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: BINGO_DEV_SUPABASE_URL
          valueFrom:
            secretKeyRef:
              name: bingo-dev-db-monitor
              key: BINGO_DEV_SUPABASE_URL
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: BINGO_DEV_SUPABASE_ANON_KEY
          valueFrom:
            secretKeyRef:
              name: bingo-dev-db-monitor
              key: BINGO_DEV_SUPABASE_ANON_KEY
  - target:
      kind: Ingress
      name: gatus
    patch: |-
      - op: replace
        path: /spec/rules/0/http/paths/0/backend/service/name
        value: gatus-public

commonLabels:
  app: gatus-public
  environment: production
